<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Acreflow</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F1E6; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #1F4D3B; }
      .card { text-align: center; padding: 2rem; max-width: 26rem; }
      .logo { width: 56px; height: 56px; border-radius: 16px; background: #1F4D3B; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #6b7061; line-height: 1.5; margin: 0 0 1.5rem; }
      button { background: #1F4D3B; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.4rem; font-size: .9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="logo">
        <svg width="30" height="30" viewBox="0 0 512 512" fill="none" stroke-width="26" stroke-linecap="round">
          <path d="M116 196 C 168 162 209 162 256 196 C 303 230 344 230 396 196" stroke="#D4A437" />
          <path d="M116 256 C 168 222 209 222 256 256 C 303 290 344 290 396 256" stroke="#F4F1E6" />
          <path d="M116 316 C 168 282 209 282 256 316 C 303 350 344 350 396 316" stroke="#F4F1E6" />
        </svg>
      </span>
      <h1>You're offline</h1>
      <p>Acreflow needs a connection to load this page. Anything you logged offline is saved on this device and will sync automatically when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
