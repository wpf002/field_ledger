<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Acreflow</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f2efe6; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #2f3d29; }
      .card { text-align: center; padding: 2rem; max-width: 26rem; }
      .logo { width: 56px; height: 56px; border-radius: 16px; background: #2f3d29; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #6b7061; line-height: 1.5; margin: 0 0 1.5rem; }
      button { background: #2f3d29; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.4rem; font-size: .9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="logo">
        <svg width="30" height="30" viewBox="0 0 512 512" fill="none" stroke="#f2efe6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
          <path d="M256 388V214" />
          <path d="M256 250c0-46-38-84-84-84-14 0-26 3-26 3s-3 12-3 26c0 46 38 84 84 84 14 0 26-3 26-3s3-12 3-26z" />
          <path d="M256 214c0-46 38-84 84-84 14 0 26 3 26 3s3 12 3 26c0 46-38 84-84 84-14 0-26-3-26-3s-3-12-3-26z" />
        </svg>
      </span>
      <h1>You're offline</h1>
      <p>Acreflow needs a connection to load this page. Anything you logged offline is saved on this device and will sync automatically when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
